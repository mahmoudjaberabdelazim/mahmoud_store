<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Mahmoud Gaber Abu Aliwa – متجر الملابس والساعات</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & VARIABLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --black: #0b0b0b;
            --gold: #c9a84c;
            --gold-light: #e8d5a3;
            --soft: #f8f7f5;
            --white: #ffffff;
            --muted: #6b6b6b;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --transition: 0.25s ease;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--soft);
            color: #1a1a1a;
            line-height: 1.6;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            background: none;
        }

        /* ===== UTILITY ===== */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: var(--transition);
            background: var(--black);
            color: var(--white);
            border: 2px solid var(--black);
        }
        .btn:hover {
            background: transparent;
            color: var(--black);
        }
        .btn-gold {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--white);
        }
        .btn-gold:hover {
            background: transparent;
            color: var(--gold);
        }
        .btn-outline {
            background: transparent;
            color: var(--black);
            border: 2px solid var(--black);
        }
        .btn-outline:hover {
            background: var(--black);
            color: var(--white);
        }
        .section-title {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .section-sub {
            color: var(--muted);
            margin-bottom: 32px;
            font-size: 1.1rem;
        }
        .text-center {
            text-align: center;
        }

        /* ===== HEADER / NAV ===== */
        .top-bar {
            background: var(--black);
            color: var(--white);
            text-align: center;
            padding: 8px 16px;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 5%;
            transition: var(--transition);
        }
        .logo {
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: -0.5px;
            color: var(--black);
        }
        .logo span {
            color: var(--gold);
        }
        .nav-links {
            display: flex;
            gap: 28px;
            font-weight: 600;
        }
        .nav-links a {
            font-size: 0.95rem;
            transition: var(--transition);
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: var(--transition);
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .cart-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--black);
            color: var(--white);
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: var(--transition);
        }
        .cart-btn:hover {
            background: var(--gold);
            color: var(--black);
        }
        .cart-count {
            background: var(--gold);
            color: var(--black);
            border-radius: 30px;
            padding: 0 10px;
            font-size: 0.8rem;
            line-height: 22px;
            font-weight: 900;
        }

        /* ===== HERO ===== */
        .hero {
            background: var(--black);
            color: var(--white);
            padding: 70px 5% 60px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 40px;
            align-items: center;
            border-radius: 0 0 40px 40px;
        }
        .hero h1 {
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -2px;
            margin-bottom: 12px;
        }
        .hero h1 span {
            color: var(--gold);
        }
        .hero p {
            color: #b0b0b0;
            max-width: 480px;
            font-size: 1.1rem;
            margin-bottom: 28px;
        }
        .hero-image {
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #2a2a2a, #0b0b0b 70%);
            border-radius: 30px;
            padding: 40px 20px;
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 12px;
            color: var(--gold);
            border: 1px solid #2a2a2a;
            min-height: 300px;
        }

        /* ===== FILTERS ===== */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 32px;
        }
        .filter-btn {
            padding: 8px 22px;
            border-radius: 40px;
            background: var(--white);
            border: 1px solid #ddd;
            font-weight: 600;
            transition: var(--transition);
            font-size: 0.9rem;
        }
        .filter-btn.active {
            background: var(--black);
            color: var(--white);
            border-color: var(--black);
        }
        .filter-btn:hover {
            border-color: var(--black);
        }

        /* ===== PRODUCT GRID ===== */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            margin-top: 12px;
        }
        .product-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        .product-img {
            height: 240px;
            background: #f0efec;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.4rem;
            color: #aaa;
            position: relative;
            overflow: hidden;
        }
        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }
        .product-card:hover .product-img img {
            transform: scale(1.03);
        }
        .product-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--gold);
            color: var(--black);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .product-info {
            padding: 18px 16px 20px;
        }
        .product-info h3 {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .product-info .category {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .product-info .price {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--black);
            margin-bottom: 12px;
        }
        .product-info .price span {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--muted);
        }
        .product-actions {
            display: flex;
            gap: 8px;
        }
        .product-actions button {
            flex: 1;
            padding: 8px 0;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.85rem;
            transition: var(--transition);
            background: var(--black);
            color: var(--white);
            border: 2px solid var(--black);
        }
        .product-actions button.outline {
            background: transparent;
            color: var(--black);
            flex: 0.5;
        }
        .product-actions button.outline:hover {
            background: var(--black);
            color: var(--white);
        }
        .product-actions button:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--black);
        }

        /* ===== ABOUT ===== */
        .about-section {
            background: var(--black);
            color: var(--white);
            padding: 60px 5%;
            border-radius: 40px;
            margin: 60px 5%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }
        .about-section h2 {
            font-size: 2.6rem;
            font-weight: 900;
            line-height: 1.15;
        }
        .about-section h2 span {
            color: var(--gold);
        }
        .about-section p {
            color: #bcbcbc;
            max-width: 500px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .stat {
            background: #1a1a1a;
            padding: 24px 16px;
            border-radius: var(--radius);
            text-align: center;
            border: 1px solid #2a2a2a;
        }
        .stat b {
            display: block;
            font-size: 2rem;
            color: var(--gold);
        }

        /* ===== CART DRAWER ===== */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: none;
            justify-content: flex-end;
        }
        .cart-overlay.open {
            display: flex;
        }
        .cart-panel {
            background: var(--white);
            width: 440px;
            max-width: 94vw;
            height: 100%;
            padding: 28px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .cart-header h2 {
            font-size: 1.6rem;
            font-weight: 900;
        }
        .cart-close {
            font-size: 1.6rem;
            line-height: 1;
            background: #f0f0f0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .cart-close:hover {
            background: #ddd;
        }
        .cart-item {
            display: grid;
            grid-template-columns: 60px 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }
        .cart-item-img {
            width: 60px;
            height: 60px;
            background: #f0efec;
            border-radius: 10px;
            overflow: hidden;
        }
        .cart-item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cart-item-info h4 {
            font-size: 0.95rem;
            font-weight: 700;
        }
        .cart-item-info .item-price {
            font-size: 0.85rem;
            color: var(--muted);
        }
        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cart-item-qty button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #f0f0f0;
            font-weight: 700;
            transition: var(--transition);
        }
        .cart-item-qty button:hover {
            background: var(--black);
            color: var(--white);
        }
        .cart-item-remove {
            color: #c0392b;
            font-weight: 700;
            font-size: 0.8rem;
            background: none;
            padding: 4px 8px;
        }
        .cart-total {
            margin-top: auto;
            padding-top: 20px;
            border-top: 2px solid var(--black);
            font-size: 1.3rem;
            font-weight: 900;
            display: flex;
            justify-content: space-between;
        }
        .cart-checkout {
            margin-top: 16px;
        }
        .cart-checkout .btn {
            width: 100%;
            text-align: center;
        }

        /* ===== CHECKOUT FORM ===== */
        .checkout-form {
            margin-top: 20px;
            display: none;
        }
        .checkout-form.show {
            display: block;
        }
        .checkout-form .field {
            margin-bottom: 14px;
        }
        .checkout-form label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }
        .checkout-form input,
        .checkout-form select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            background: var(--white);
            transition: var(--transition);
        }
        .checkout-form input:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.2);
        }
        .payment-info {
            background: #f8f7f5;
            border-radius: var(--radius);
            padding: 16px;
            margin: 16px 0;
            border: 1px solid #eee;
        }
        .payment-info strong {
            color: var(--gold);
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: var(--white);
            border-radius: 24px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 16px;
            left: 16px;
            background: #f0f0f0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            transition: var(--transition);
        }
        .modal-close:hover {
            background: #ddd;
        }
        .modal-product {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 12px;
        }
        .modal-product .detail-img {
            background: #f0efec;
            border-radius: var(--radius);
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .modal-product .detail-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal-product .detail-info h2 {
            font-size: 1.8rem;
            font-weight: 900;
        }
        .modal-product .detail-info .price {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--gold);
            margin: 8px 0 16px;
        }
        .modal-product .detail-info p {
            color: var(--muted);
            margin-bottom: 16px;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--black);
            color: var(--white);
            padding: 16px 28px;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            transform: translateY(80px);
            opacity: 0;
            transition: 0.4s ease;
            z-index: 999;
            pointer-events: none;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* ===== FOOTER ===== */
        footer {
            background: var(--black);
            color: #aaa;
            padding: 40px 5%;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 40px;
        }
        footer .logo {
            color: var(--white);
        }
        footer .logo span {
            color: var(--gold);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: center;
                padding: 50px 5%;
            }
            .hero p {
                margin: 0 auto 24px;
            }
            .about-section {
                grid-template-columns: 1fr;
                text-align: center;
                margin: 40px 4%;
                padding: 40px 6%;
            }
            .about-section p {
                margin: 0 auto;
            }
            .stats {
                grid-template-columns: 1fr 1fr;
            }
            .modal-product {
                grid-template-columns: 1fr;
            }
            .nav-links {
                display: none;
            }
            .cart-panel {
                width: 100%;
                max-width: 100%;
            }
        }
        @media (max-width: 550px) {
            .product-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .product-img {
                height: 160px;
            }
            .product-info {
                padding: 12px;
            }
            .product-info h3 {
                font-size: 0.9rem;
            }
            .product-actions button {
                font-size: 0.75rem;
